name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android Licenses (Injection)
      run: |
        mkdir -p ${ANDROID_HOME}/licenses
        echo "24333f8a63b6825ea9c5573f83c2eb754130b1b2" > ${ANDROID_HOME}/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ${ANDROID_HOME}/licenses/android-sdk-preview-license

    - name: Install NativeScript
      run: npm install -g nativescript

    - name: Force Fix and Build
      run: |
        # 1. Проверяем, где мы находимся (диагностика в лог)
        ls -R
        
        # Переходим в папку проекта (если она есть) или остаемся в корне
        [ -d "calculator-app" ] && cd calculator-app || echo "Working in root"

        # 2. ПРИНУДИТЕЛЬНО создаем package.json с нуля, если он кривой
        # Мы берем текущий и вшиваем в него структуру NativeScript через мощный инструмент 'jq'
        sudo apt-get install jq -y
        jq '. + { "nativescript": { "id": "org.nativescript.calculator" } }' package.json > package.json.tmp && mv package.json.tmp package.json

        # 3. Создаем JS-конфиг (JS надежнее TS в среде CI)
        cat <<EOF > nativescript.config.js
        module.exports = {
          id: 'org.nativescript.calculator',
          appPath: 'src',
          appResourcesPath: 'App_Resources',
          android: {
            v8Flags: '--expose_gc',
            markingMode: 'none'
          }
        };
        EOF

        # 4. Установка зависимостей
        npm install --save @nativescript/core @nativescript/android
        npm install

        # 5. СБОРКА с принудительной очисткой
        npx ns build android --release --no-hmr --env.production --force
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: "**/platforms/android/app/build/outputs/apk/release/*.apk"
