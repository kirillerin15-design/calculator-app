name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Загружаем код из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Настраиваем Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3. Настраиваем Java (критично для Android)
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # 4. Настраиваем Android SDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 5. Принимаем лицензии Android (чтобы сборка не встала)
    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    # 6. Устанавливаем NativeScript CLI
    - name: Install NativeScript
      run: npm install -g nativescript

    # 7. Устанавливаем зависимости и собираем APK
    # ВНИМАНИЕ: используем npx ns, чтобы избежать ошибки 127
    - name: Build APK
      run: |
        cd calculator-app
        npm install
        npx ns platform add android --copy-from ../
        npx ns build android --release --no-hmr

    # 8. Сохраняем готовый файл APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: calculator-app/platforms/android/app/build/outputs/apk/release/*.apk
