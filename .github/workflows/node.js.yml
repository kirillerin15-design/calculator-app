name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    - name: Install NativeScript CLI
      run: npm install -g nativescript

    - name: Build APK
      run: |
        cd calculator-app
        npm install
        
        # ШАГ-СПАСИТЕЛЬ: Принудительно создаем файл конфигурации
        # Это гарантирует, что NativeScript увидит ID приложения
        cat <<EOF > nativescript.config.ts
        import { NativeScriptConfig } from '@nativescript/core';
        export default {
          id: 'org.nativescript.calculator',
          appResourcesPath: 'App_Resources',
          android: {
            v8Flags: '--expose_gc',
            markingMode: 'none'
          }
        } as NativeScriptConfig;
        EOF

        # Теперь запускаем сборку
        npx ns build android --release --no-hmr

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: calculator-app/platforms/android/app/build/outputs/apk/release/*.apk
