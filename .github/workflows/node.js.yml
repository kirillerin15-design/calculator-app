name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Force Accept Android Licenses
      run: |
        mkdir -p ${ANDROID_HOME}/licenses
        echo "24333f8a63b6825ea9c5573f83c2eb754130b1b2" > ${ANDROID_HOME}/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > ${ANDROID_HOME}/licenses/android-sdk-preview-license

    - name: Install NativeScript
      run: npm install -g nativescript

    - name: Nuclear Fix and Build
      run: |
        cd calculator-app
        
        # 1. Создаем правильный package.json
        cat <<EOF > package.json
        {
          "name": "calculator-app",
          "main": "app.js",
          "displayName": "Calculator",
          "version": "1.0.0",
          "private": true,
          "dependencies": {
            "@nativescript/core": "~9.0.0",
            "@nativescript/android": "~9.0.0"
          },
          "nativescript": {
            "id": "org.nativescript.calculator"
          }
        }
        EOF

        # 2. Создаем конфиг
        cat <<EOF > nativescript.config.js
        module.exports = {
          id: 'org.nativescript.calculator',
          appPath: '.',
          appResourcesPath: 'App_Resources',
          android: {
            v8Flags: '--expose_gc',
            markingMode: 'none'
          }
        };
        EOF

        mkdir -p App_Resources/Android

        # 3. Установка
        npm install

        # 4. СБОРКА DEBUG ВЕРСИИ (без требования ключей)
        npx ns build android --no-hmr --force

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: "**/platforms/android/app/build/outputs/apk/debug/*.apk"
