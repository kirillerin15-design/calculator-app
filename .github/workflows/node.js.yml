name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses

    - name: Install NativeScript CLI
      run: npm install -g nativescript

    - name: Prepare and Build APK
      run: |
        cd calculator-app
        
        # 1. Принудительно обновляем package.json, чтобы NativeScript его узнал
        # Добавляем блок "nativescript" с ID приложения
        node -e "
        const fs = require('fs');
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        pkg.nativescript = { id: 'org.nativescript.calculator' };
        fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
        "

        # 2. Устанавливаем зависимости
        npm install

        # 3. Создаем файл конфигурации (на всякий случай)
        cat <<EOF > nativescript.config.ts
        import { NativeScriptConfig } from '@nativescript/core';
        export default {
          id: 'org.nativescript.calculator',
          appResourcesPath: 'App_Resources',
          android: {
            v8Flags: '--expose_gc',
            markingMode: 'none'
          }
        } as NativeScriptConfig;
        EOF

        # 4. Запускаем сборку
        npx ns build android --release --no-hmr

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: calculator-app/platforms/android/app/build/outputs/apk/release/*.apk
